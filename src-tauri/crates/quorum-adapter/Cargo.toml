# WP-S4a.1 — the vendor adapter core + the Claude Code integration.
#
# Ships to developer machines and runs on every tool call, so it stays small:
# no HTTP crate (the bridge is loopback and the protocol is four lines), no
# async runtime, no TLS.
[package]
name = "quorum-adapter"
version = "0.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "citrate-quorum agent adapters — gate a vendor agent's tool calls through the Quorum policy gate before they run."

[[bin]]
name = "quorum-adapter"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[lints]
workspace = true
