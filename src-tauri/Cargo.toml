# citrate-quorum — the Tauri desktop app (backend). WP-S1.3.
#
# Consumes citrate-core-kit (the shared signing/custody/oidc/supervisor spine) so
# the SignatureCeremony — the single HITL signing path — is ONE implementation
# across the federation, never forked. See EXTRACTION_PLAN.md.
[package]
name = "citrate-quorum"
version = "0.0.0"
description = "citrate-quorum — governance for agents (Tauri desktop app). T1."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "citrate_quorum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The shared spine. LOCAL DEV: a path dep to the sibling checkout — works today,
# no SSH alias needed. PRODUCTION/CI: switch to the pinned SSH git dep once a
# `github-citrate-core` alias + read-only deploy key are provisioned (owner infra,
# mirroring citrate-agent-runtime's citrate-wallet-core dep). Pin target:
# citrate-core main @ 5a1b5c3 (the PR #82 merge — the kit's first shipped rev).
#   citrate-core-kit = { git = "ssh://git@github-citrate-core/CitrateNetwork/citrate-core", rev = "5a1b5c3" }
citrate-core-kit = { path = "../../citrate-core/kit" }

# Quorum's own backend crates (freeze-independent, WP-S1.4/1.5/1.6).
quorum-tenancy = { path = "crates/quorum-tenancy" }
quorum-license = { path = "crates/quorum-license" }
quorum-rbac = { path = "crates/quorum-rbac" }
quorum-session = { path = "crates/quorum-session" }
quorum-clearance = { path = "crates/quorum-clearance" }
quorum-audit = { path = "crates/quorum-audit" }
quorum-policy = { path = "crates/quorum-policy" }
quorum-meetings = { path = "crates/quorum-meetings" }

# Rooms (QRM-S3): a real MLS session against the citrate-comms server-blind relay.
# `comms-session` is the UI-free member session extracted upstream (citrate-comms
# PR #42) precisely so a Tauri app can hold one; it links neither the relay server
# (RocksDB + axum + keyring) nor a second UI toolkit — asserted there by
# `client_links_no_server.rs`. LOCAL DEV: a path dep to the sibling checkout, same
# as citrate-core-kit; PRODUCTION: a pinned SSH git dep once the deploy key exists.
comms-session = { path = "../../citrate-comms/crates/comms-session" }
comms-core = { path = "../../citrate-comms/crates/comms-core", default-features = false, features = ["mls"] }
comms-proto = { path = "../../citrate-comms/crates/comms-proto" }

tauri = { version = "2", features = [] }
# The rooms subsystem is async I/O against a relay; Tauri's own async runtime is
# tokio, so a command can await on it directly. `time` for the non-blocking drain.
tokio = { version = "1", features = ["sync", "time", "rt"] }
tauri-plugin-opener = "2"
# The escalation notification path: an agent blocked at 2am must reach the
# operator, not wait for someone to open the Dashboard. The notification is
# deliberately contentless — see `notifyOs` in src/shell/escalations.tsx.
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tenant directory names are blake3(tenant_id) — a raw tenant id may legally
# contain path separators, so it never becomes a path component.
blake3 = "1"
# Ethereum keccak256 for ABI selectors and bytes32 ids (anchor.rs). Keccak256,
# NOT Sha3_256 — different padding, and every selector would be wrong.
sha3 = "0.10"
# agent_bridge.rs: the bearer token is 256 bits of OsRng, held Zeroizing, and
# never logged, Debug-printed, or returned by a command (CLAUDE.md rule 4).
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"

[dev-dependencies]
# The QRM-S3 exit gate (`tests/server_blindness.rs`) runs a REAL relay with a real
# on-disk store, so the proof can walk what the relay actually kept. Dev-only: the
# app itself links `comms-session`, which cannot link the server (asserted upstream
# by `client_links_no_server.rs`).
comms-relay = { path = "../../citrate-comms/crates/comms-relay" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"

[lints]
workspace = true
