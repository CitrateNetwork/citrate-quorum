# citrate-quorum — accepted advisories, with names, reasons and an expiry.
#
# THE RULE THIS FILE IS WRITTEN UNDER
#
# An advisory is ignored here only when it cannot be fixed from this repository,
# and only with the blocker written down in a form someone can re-test. A
# suppressed advisory is invisible the day someone can finally act on it, so
# `scripts/check_audit_ignores.py` runs in the gate and FAILS when:
#   * the expiry below passes (forcing a fresh decision, not a renewal by
#     default),
#   * an ignored advisory stops being reported (the ignore is stale — delete it),
#   * or the upstream blocker lifts (hpke-rs >= 0.7 in the lock), the first
#     point at which any of these becomes fixable.
#
# WHAT IS ACCEPTED, AND WHY
#
# All eight come from `libcrux`, pulled by `hpke-rs 0.6.1`, pulled by
# `openmls_rust_crypto 0.5.1`. We got here on purpose: OpenMLS 0.6 pinned
# `hpke-rs 0.2.0`, which carried FOUR advisories including RUSTSEC-2026-0071 —
# 9.3 critical, nonce reuse in HPKE context, under the primitive MLS uses to seal
# a group secret. The owner chose the upgrade (citrate-comms PR #43) and it
# cleared all four. This is the residue.
#
# It cannot be raised from here. Cargo treats `0.0.x` releases as mutually
# incompatible, so adding a newer libcrux to any manifest simply puts BOTH in the
# graph — verified, not assumed.
#
# BLOCKER: openmls 0.9 / openmls_rust_crypto 0.6 migration (hpke-rs 0.7+).
# openmls_rust_crypto 0.5.1 requires hpke-rs `^0.6`. hpke-rs 0.7 brings
# libcrux-sha3 0.0.10 and libcrux-secrets 0.0.6 (fixes 0207, 0208, 0212).
# libcrux-kem 0.0.10 (fixes 0330, 0331) arrives only with hpke-rs 0.8, which no
# published openmls_rust_crypto accepts yet. libcrux-aesgcm (0209, 0211) has no
# fixed release.
#
# CIPHERSUITE. comms and quorum use MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519
# through openmls_rust_crypto 0.5.1. hpke-rs's SHAKE path serves only the
# X-Wing / ML-KEM KEMs, which that ciphersuite does not select.
#
# Severity has genuinely come down: a critical confidentiality break was traded
# for high-severity panics, a SHAKE correctness bug, and a select/swap result bug on
# aarch64. That is an improvement, not a resolution, and nothing here should be
# read as "the MLS stack is clean".
#
# Full analysis, including which of these are actually LINKED by the app (two are
# in the lockfile but not in the built binary's graph; libcrux-kem, added later, is also
# not compiled):
# .agentile/docs/audits/2026-07-26_hpke-rs-advisories-in-the-mls-stack.md
#
# EXPIRES: 2026-11-09  (start of audit phase A — re-decide, do not renew by reflex)
#
# Renewed 2026-10-22 by owner decision, time-boxed to 2026-11-09. The first
# acceptance ran to 2026-10-26. libcrux-kem (0330, 0331) was added at the same
# time. Reachability of 0207, 0208 and 0212 was confirmed by a private
# assessment on 2026-10-22.

[advisories]
ignore = [
    # libcrux-sha3 0.0.8 (fixed in 0.0.10, needs hpke-rs 0.7)
    "RUSTSEC-2026-0207", # linked, not reachable: incremental SHAKE is used only by the X-Wing/ML-KEM KEMs, not this ciphersuite
    "RUSTSEC-2026-0208", # linked, not reachable: AVX2 SHAKE-256 is used only by the X-Wing/ML-KEM KEMs, not this ciphersuite
    # libcrux-secrets 0.0.5 (fixed in 0.0.6, needs hpke-rs 0.7)
    "RUSTSEC-2026-0212", # linked, not reachable: aarch64 select/swap may return wrong results; no caller, 0 libcrux_secrets symbols in the aarch64 daemon binary
    # libcrux-aesgcm 0.0.7 (no fixed release) and libcrux-chacha20poly1305 (fixed in 0.0.8)
    "RUSTSEC-2026-0209", # not compiled: AES-GCM AAD length not bounded; hpke-rs's optional libcrux backend is off
    "RUSTSEC-2026-0211", # not compiled: AES-GCM tag comparison not constant-time; hpke-rs's optional libcrux backend is off
    "RUSTSEC-2026-0124", # not compiled: panic on overlong ciphertext buffer; hpke-rs's optional libcrux backend is off
    # libcrux-kem 0.0.7 (fixed in 0.0.10, needs hpke-rs 0.8)
    "RUSTSEC-2026-0330", # not compiled: panic in hybrid encapsulate_derand on a short seed; optional libcrux backend is off
    "RUSTSEC-2026-0331", # not compiled: panic decoding short hybrid X25519MlKem768/XWing keys; optional libcrux backend is off
]
