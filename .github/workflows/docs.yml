# created: 2026-07-22 | branch: main
# author: Claude Opus 4.8 (1M context), directed by @SaulBuilds
# status: active
#
# Honest CI: this repo is a scaffold with no source code yet, so only the
# frontmatter check runs. The Rust + Node jobs (fmt, clippy -D warnings, test,
# cargo audit, typecheck, vitest) and the Agentile ratchets land in the same PR
# as the code they check — WP-S1.7. Adding them now would mean green checks that
# verify nothing, which is the CI form of a mock.
#
# A relative-link checker was written for the bootstrap commit and removed here:
# its `fail` variable was assigned inside a pipeline subshell, so it could never
# make the job fail. A check that cannot fail is exactly the green-that-verifies-
# nothing this file is meant to avoid. It returns in WP-S1.7, written correctly.
name: docs

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  frontmatter:
    name: docs (frontmatter, links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Every markdown doc has YAML frontmatter (Rule 12)
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if [ "$(head -c 4 "$f")" != "---" ]; then
              echo "::error file=$f::missing YAML frontmatter (created/branch/author/status)"
              fail=1
            fi
          done < <(find . -name '*.md' -not -path './node_modules/*' -not -path './.git/*' \
                     -not -name 'README.md' -not -name 'CHANGELOG.md' -not -name 'CONTRIBUTING.md' \
                     -not -name 'CODE_OF_CONDUCT.md' -not -name 'SECURITY.md' \
                     -not -name 'PATENTS.md' -not -name 'TRADEMARK.md' -not -name 'LICENSE.md')
          # Rule 12 governs WORKING docs (sprints/journals/design) — they carry
          # created/branch/author/status provenance. The conventional root docs
          # (README + the legal/community boilerplate added at open-sourcing) are
          # not working docs and must NOT carry sprint frontmatter (it renders as
          # a table on the public repo homepage). They are excluded here.
          exit $fail

  hic-terminology:
    # Own job so a failing frontmatter step cannot skip it (PBA-L8-018).
    name: HIC terminology guard (PBA-L8-018)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: HIC terminology in docs, UI strings, comments and descriptions
        run: |
          python3 scripts/check_hic_terminology.py --self-test
          python3 scripts/check_hic_terminology.py
