# created: 2026-07-22 | branch: main
# author: Claude Opus 4.8 (1M context), directed by @SaulBuilds
# status: active
#
# Honest CI: this repo is a scaffold with no source code yet, so only the
# frontmatter check runs. The Rust + Node jobs (fmt, clippy -D warnings, test,
# cargo audit, typecheck, vitest) and the Agentile ratchets land in the same PR
# as the code they check — WP-S1.7. Adding them now would mean green checks that
# verify nothing, which is the CI form of a mock.
#
# A relative-link checker was written for the bootstrap commit and removed here:
# its `fail` variable was assigned inside a pipeline subshell, so it could never
# make the job fail. A check that cannot fail is exactly the green-that-verifies-
# nothing this file is meant to avoid. It returns in WP-S1.7, written correctly.
name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontmatter:
    name: docs (frontmatter, links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every markdown doc has YAML frontmatter (Rule 12)
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if [ "$(head -c 4 "$f")" != "---" ]; then
              echo "::error file=$f::missing YAML frontmatter (created/branch/author/status)"
              fail=1
            fi
          done < <(find . -name '*.md' -not -path './node_modules/*' -not -path './.git/*')
          exit $fail
